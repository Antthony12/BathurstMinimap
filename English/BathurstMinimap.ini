; Bathurst map configuration.
; You can edit these values and reload scripts (or restart the game) to see the changes.
; Use a dot (.) as the decimal separator, not a comma.

[Circuit]
; If the circuit mod ever gets moved in the GTA world (displacement,
; no rotation), set here how much it moved so the map follows it
; automatically. 0,0 = circuit in its original position.
OffsetX=0
OffsetY=0

; How close (in game units, roughly meters) the player needs to be to the
; track for it to be considered "on the circuit". Adjust to taste.
OnTrackDistance=20

[Map]
; Top-left corner position of the map on screen (pixels).
PosX=-80
PosY=0

; Map size on screen (pixels).
Width=400
Height=400

[Pin]
; Size of the dot that marks your position (pixels).
Width=6
Height=6
